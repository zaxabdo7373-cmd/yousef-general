name: Yousef General Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Build Android APK with Godot
        uses: barichello/godot-ci:4.3
        with:
          godot-version: 4.3
          export-templates: true
        env:
          GODOT_VERSION: 4.3

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/YousefGeneral.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yousef-General-APK
          path: build/YousefGeneral.apk
