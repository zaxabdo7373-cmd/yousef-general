name: Yousef General Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/YousefGeneral.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yousef-General-APK
          path: build/YousefGeneral.apk
