workflows:
  android-build:
    name: Yousef General - Android APK
    max_build_duration: 60
    instance_type: linux

    environment:
      java: 17

    scripts:
      - name: Install Godot
        script: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -o godot.zip -d godot
          chmod +x godot/Godot_v4.3-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -o templates.tpz -d templates
          cp templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Export Android APK
        script: |
          set -e
          mkdir -p build
          godot/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit
          godot/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android" build/YousefGeneral.apk

    artifacts:
      - build/*.apk
